name: 功能需求（简体中文）
description: 说明用户需求和改进建议。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 你希望完成什么，目前遇到哪些阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与替代方案
      description: 可附配置示例，并说明是否适合作为可选功能。
    validations:
      required: true
